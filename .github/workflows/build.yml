name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: List project files
        run: find . -type f -not -path "./.git/*" | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --console=plain > build.log 2>&1
          code=$?
          echo "=============== ERRORS ==============="
          grep -E "^e: |What went wrong|error:|Execution failed|Could not|Unresolved|A problem occurred" -A3 build.log | head -60
          echo "=============== END (exit code $code) ==============="
          exit $code

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: LifeManager-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-log
          path: build.log
